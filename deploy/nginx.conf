# Reference nginx config for self-hosted production. Place at
# /etc/nginx/sites-enabled/jaguar after editing server_name, then
# `sudo nginx -t && sudo systemctl reload nginx`.
#
# This proxies:
#   /                  -> Flask GUI (gunicorn on :5000)
#   /mobile            -> FastAPI mobile API (uvicorn on :8000)
#   /docs /redoc       -> FastAPI auto-docs (uvicorn on :8000)

upstream jaguar_gui {
    server 127.0.0.1:5000 fail_timeout=0;
}

upstream jaguar_api {
    server 127.0.0.1:8000 fail_timeout=0;
}

server {
    listen 80;
    server_name jaguar.example.com;

    client_max_body_size 32m;

    # GUI
    location / {
        proxy_pass http://jaguar_gui;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 120s;
    }

    # FastAPI mobile API (both the user-facing prefix and the auto-docs)
    location ~ ^/(mobile|docs|redoc|openapi.json) {
        proxy_pass http://jaguar_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 120s;
    }

    # Static assets served by the GUI (cached for 7 days).
    location /static/ {
        proxy_pass http://jaguar_gui;
        proxy_cache_valid 200 7d;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }
}
