<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Account - Jaguar AI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .verify-container {
            max-width: 400px;
            margin: 100px auto;
            text-align: center;
            padding: 2rem;
            background: #101820;
            border-radius: 10px;
            border: 1px solid #20e6d7;
            box-shadow: 0 0 20px rgba(32, 230, 215, 0.2);
            color: white;
        }
        .verify-container h2 { color: #20e6d7; margin-bottom: 1rem; }
        .verify-container p { margin-bottom: 2rem; color: #ccc; }
        .otp-input {
            width: 100%;
            padding: 12px;
            margin-bottom: 1.5rem;
            background: #1a242f;
            border: 1px solid #333;
            color: white;
            text-align: center;
            font-size: 24px;
            letter-spacing: 5px;
            border-radius: 5px;
        }
        .otp-input:focus { outline: none; border-color: #20e6d7; }
        .verify-btn {
            width: 100%;
            padding: 12px;
            background: #20e6d7;
            color: #101820;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .verify-btn:hover { opacity: 0.9; }
        .flash-messages {
            margin-bottom: 1rem;
        }
        .flash-message {
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 10px;
            font-size: 0.9rem;
        }
        .flash-message.error { background: #ff4d4d; color: white; }
        .flash-message.success { background: #2ecc71; color: white; }
        .flash-message.info { background: #3498db; color: white; }
    </style>
</head>
<body>
    <div class="verify-container">
        <h2>Verify Your Account</h2>
        <p>Please enter the 6-digit verification code sent to your email.</p>

        <div class="flash-messages">
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="flash-message {{ category }}">{{ message }}</div>
                    {% endfor %}
                {% endif %}
            {% endwith %}
        </div>

        <form method="POST">
            <input type="text" name="otp" class="otp-input" placeholder="000000" maxlength="6" required autofocus>
            <button type="submit" class="verify-btn">Verify Account</button>

            <div style="margin-top: 1.5rem; display: flex; gap: 10px; justify-content: center;">
                <button type="submit" name="action" value="resend" class="resend-btn">Resend OTP</button>
                <a href="{{ url_for('auth.login') }}" class="back-btn">Back to Login</a>
            </div>
        </form>
    </div>
</body>
</html>
<style>
    .resend-btn {
        background: transparent;
        color: #20e6d7;
        border: 1px solid #20e6d7;
        padding: 8px 15px;
        border-radius: 5px;
        cursor: pointer;
        font-size: 0.9rem;
        transition: all 0.2s;
    }
    .resend-btn:hover {
        background: rgba(32, 230, 215, 0.1);
    }
    .back-btn {
        color: #aaa;
        text-decoration: none;
        font-size: 0.9rem;
        padding: 8px 15px;
        transition: color 0.2s;
    }
    .back-btn:hover {
        color: white;
    }
</style>
