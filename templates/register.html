<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create account · Jaguar AI</title>
<link rel="icon" href="{{ url_for('static', filename='icon.png') }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#060a10; --panel:#0d141d; --panel-border:#1c2733;
    --cyan:#20e6d7; --amber:#ffb020; --text:#e7eef4; --muted:#7f93a3; --danger:#ff5c72;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; font-family:'Inter',sans-serif; color:var(--text);
    background:
      radial-gradient(circle at 15% 20%, rgba(32,230,215,0.10), transparent 40%),
      radial-gradient(circle at 85% 80%, rgba(255,176,32,0.08), transparent 45%),
      var(--bg);
    display:flex; align-items:center; justify-content:center; padding:24px;
    position:relative; overflow:hidden;
  }
  body::before{
    content:""; position:absolute; inset:0; opacity:0.045; pointer-events:none;
    background-image:
      linear-gradient(var(--cyan) 1px, transparent 1px),
      linear-gradient(90deg, var(--cyan) 1px, transparent 1px);
    background-size: 42px 42px;
  }
  .card{
    position:relative; z-index:1; width:100%; max-width:420px;
    background:linear-gradient(180deg, rgba(20,29,38,0.9), rgba(10,15,20,0.9));
    border:1px solid var(--panel-border); border-radius:16px;
    padding:34px 32px 28px;
    box-shadow: 0 0 0 1px rgba(32,230,215,0.05), 0 30px 60px rgba(0,0,0,0.5);
  }
  .brand{ display:flex; flex-direction:column; align-items:center; margin-bottom:18px; }
  .brand img{ width:56px; height:56px; border-radius:50%; box-shadow:0 0 22px rgba(32,230,215,0.45); margin-bottom:10px; }
  .brand h1{ font-family:'Orbitron',sans-serif; font-size:20px; letter-spacing:2px; margin:0; text-transform:uppercase; }
  .brand span{ color:var(--cyan); }
  .brand p{ color:var(--muted); font-size:12px; letter-spacing:1.5px; text-transform:uppercase; margin:6px 0 0; }

  .flash{ padding:10px 12px; border-radius:8px; font-size:13.5px; margin-bottom:12px; }
  .flash.error{ background:rgba(255,92,114,0.12); border:1px solid rgba(255,92,114,0.4); color:#ffb3bd; }
  .flash.success{ background:rgba(32,230,215,0.1); border:1px solid rgba(32,230,215,0.4); color:var(--cyan); }

  .row{ display:flex; gap:12px; }
  .row > div{ flex:1; }
  label{ display:block; font-size:12px; color:var(--muted); margin:14px 0 6px; letter-spacing:0.4px; }
  input{
    width:100%; padding:10px 12px; border-radius:9px; border:1px solid var(--panel-border);
    background:#0a1017; color:var(--text); font-size:14px; font-family:'Inter',sans-serif;
  }
  input:focus{ outline:none; border-color:var(--cyan); box-shadow:0 0 0 3px rgba(32,230,215,0.12); }

  button.primary{
    width:100%; margin-top:22px; padding:12px; border:none; border-radius:9px;
    background:linear-gradient(90deg, var(--cyan), #17b5a8);
    color:#04141b; font-weight:700; font-size:14.5px; letter-spacing:0.5px; cursor:pointer;
    transition:transform .12s, box-shadow .12s;
  }
  button.primary:hover{ transform:translateY(-1px); box-shadow:0 8px 22px rgba(32,230,215,0.25); }

  .switch{ text-align:center; margin-top:18px; font-size:13.5px; color:var(--muted); }
  .switch a{ color:var(--cyan); text-decoration:none; font-weight:600; }
</style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <img src="{{ url_for('static', filename='icon.png') }}" alt="Jaguar AI">
      <h1>JAGUAR<span> AI</span></h1>
      <p>Create your account</p>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="flash {{ category }}">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="POST" action="{{ url_for('auth.register') }}">
      <div class="row">
        <div>
          <label for="username">Username</label>
          <input type="text" id="username" name="username" required autofocus placeholder="jsmith">
        </div>
        <div>
          <label for="full_name">Full name</label>
          <input type="text" id="full_name" name="full_name" placeholder="Jane Smith">
        </div>
      </div>

      <label for="email">Email</label>
      <input type="email" id="email" name="email" required placeholder="you@example.com">

      <div class="row">
        <div>
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required placeholder="At least 6 characters">
        </div>
        <div>
          <label for="confirm_password">Confirm password</label>
          <input type="password" id="confirm_password" name="confirm_password" required placeholder="Repeat password">
        </div>
      </div>

      <button type="submit" class="primary">Create account</button>
    </form>

    <div class="switch">Already have an account? <a href="{{ url_for('auth.login') }}">Sign in</a></div>
  </div>
</body>
</html>
